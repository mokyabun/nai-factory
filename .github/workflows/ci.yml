name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Check, test, and build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.x

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run formatting, lint, and type checks
              run: bun run check

            - name: Run tests
              run: bun run test

            - name: Check migrations
              working-directory: server
              run: |
                  bunx drizzle-kit check
                  # Fails when the schema changed without a generated migration.
                  bunx drizzle-kit generate
                  git diff --exit-code -- src/db/migrations
                  test -z "$(git status --porcelain -- src/db/migrations)"

            - name: Build app
              run: bun run build

    docker-smoke:
        name: Docker smoke test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Run smoke test
              run: bash scripts/docker-smoke-test.sh
