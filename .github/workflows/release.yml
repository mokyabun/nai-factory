name: Release

on:
    push:
        tags:
            - 'v*.*.*'

concurrency:
    group: release-${{ github.ref }}

permissions:
    contents: read

env:
    IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
    ci:
        name: CI
        uses: ./.github/workflows/ci.yml

    build:
        name: Build ${{ matrix.arch }} image
        needs: ci
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE_NAME }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Pushed untagged; the publish job tags the multi-arch index that references it.
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/${{ matrix.arch }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.arch }}
                  cache-to: type=gha,scope=${{ matrix.arch }},mode=max

            - name: Save digest
              run: echo "$DIGEST" > "$RUNNER_TEMP/digest-${{ matrix.arch }}"
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digest-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digest-${{ matrix.arch }}
                  retention-days: 1

    publish:
        name: Publish image
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digest-*
                  merge-multiple: true

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              env:
                  # GHCR reads the package description from the index annotations of multi-arch images.
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: index
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern=v{{version}}
                      type=semver,pattern=v{{major}}.{{minor}}
                      type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create multi-arch image
              run: |
                  mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  mapfile -t sources < <(sed "s|^|$IMAGE_NAME@|" "$RUNNER_TEMP"/digests/*)
                  docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${sources[@]}"

    cleanup:
        name: Delete untagged images
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            packages: write

        steps:
            # Keeps platform images that a tagged multi-arch index still references.
            - name: Delete untagged images
              uses: dataaxiom/ghcr-cleanup-action@v1
              with:
                  delete-untagged: true

    github-release:
        name: Create GitHub release
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read

        steps:
            # A release drafted in the GitHub UI (which also creates the tag) is left as is.
            - name: Create release
              run: |
                  if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                      exit 0
                  fi
                  notes=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // empty')
                  if [ -n "$notes" ]; then
                      notes_args=(--notes "$notes")
                  else
                      notes_args=(--generate-notes)
                  fi
                  gh release create "$GITHUB_REF_NAME" --verify-tag \
                      --title "NAI Factory ${GITHUB_REF_NAME#v}" "${notes_args[@]}"
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
