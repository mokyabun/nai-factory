name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Check, test, and build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.x

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run formatting, lint, and type checks
              run: bun run check

            - name: Run tests
              run: bun run test

            - name: Check migrations
              working-directory: server
              run: |
                  bunx drizzle-kit check
                  # Fails when the schema changed without a generated migration.
                  bunx drizzle-kit generate
                  git diff --exit-code -- src/db/migrations
                  test -z "$(git status --porcelain -- src/db/migrations)"

            - name: Build app
              run: bun run build

    docker-smoke:
        name: Docker smoke test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run smoke test
              run: bash scripts/docker-smoke-test.sh
